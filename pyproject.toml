[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "call-forecast"
version = "1.0.0"
description = "Forecasting, anomaly detection and capacity planning for call-analytics exports"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Proprietary" }
authors = [{ name = "Diamond Kitchen and Bath, Inc" }]
keywords = ["forecasting", "time-series", "call-center", "anomaly-detection"]

dependencies = [
    "pandas>=2.2",
    "numpy>=1.26",
    "scikit-learn>=1.4",
    "statsmodels>=0.14",
    "xgboost>=2.0",
    "holidays>=0.45",
    "PyYAML>=6.0",
    "plotly>=5.18,<7",
]

[project.optional-dependencies]
# Prophet needs a Stan toolchain and SHAP is a large install; both are optional
# because the pipeline detects their absence and degrades with a logged reason
# rather than failing.
prophet = ["prophet>=1.1"]
shap = ["shap>=0.44"]
excel = ["openpyxl>=3.1"]
dev = ["pytest>=8.0", "openpyxl>=3.1"]
all = ["prophet>=1.1", "shap>=0.44", "openpyxl>=3.1", "pytest>=8.0"]

[project.scripts]
call-forecast = "call_forecast.cli:main"

[tool.setuptools.packages.find]
include = ["call_forecast*"]

# The React dashboard ships as a pre-built single HTML file. Users install with
# pip and never see Node, so the build artefact has to be in the wheel; the
# pattern reaches into assets/ without that directory needing to be a package.
[tool.setuptools.package-data]
call_forecast = ["assets/*.html"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q --strict-markers"
filterwarnings = [
    "ignore::PendingDeprecationWarning:shap.*",
    "ignore::FutureWarning:statsmodels.*",
]
